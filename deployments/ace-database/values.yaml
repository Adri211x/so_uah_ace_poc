# ace-database - Default values
# Standalone PostgreSQL + pgvector chart for ACE platform

# Override the full resource name (default: <release>-ace-database)
fullnameOverride: ace-database

# Docker image configuration
image:
  repository: pgvector/pgvector
  tag: "0.8.1-pg16"
  pullPolicy: IfNotPresent

# PostgreSQL configuration
postgres:
  # Name of the existing Secret containing PostgreSQL credentials.
  # This Secret must be created BEFORE installing the chart.
  # Required keys:
  #   - PG_USER: PostgreSQL user (e.g., ace-admin)
  #   - PG_PASSWORD: user password /
  existingSecret: "ace-credentials"

# Service configuration
service:
  type: LoadBalancer
  port: 5432
  loadBalancerIP: ""
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# Data persistence configuration
persistence:
  enabled: true
  size: 20Gi
  # StorageClass to use (null = cluster default)
  storageClass: null
  # Use an existing PVC (leave empty to create a new one)
  # existingClaim: ""

# Number of StatefulSet replicas
replicaCount: 1

# SQL initialization configuration
# Creates the ace database.
# Tables and extensions are managed by Alembic migrations.
initSql:
  enabled: true

# Pod resources (uncomment to set limits)
# resources:
#   limits:
#     cpu: 1000m
#     memory: 2Gi
#   requests:
#     cpu: 500m
#     memory: 1Gi

# Pod annotations
podAnnotations: {}

# Additional pod labels
podLabels: {}

# Pod security context
# podSecurityContext:
#   fsGroup: 999
#   runAsUser: 999
#   runAsNonRoot: true

# Container security context
# securityContext:
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#     - ALL
#   readOnlyRootFilesystem: false

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Seed job configuration
# Populates scenarios and split_assignments tables from training files in S3
seed:
  enabled: true
  image:
    repository: python
    tag: "3.12-slim"
  s3:
    endpoint: "https://minio-api.langfuse.e2e.so.azure.datadope.co:443"
    bucket: "dvc-ace"
    existingSecret: "ace-s3-credentials"
  # DVC cache prefix inside the bucket
  dvcPrefix: "dvc/files/md5"
  # Training files: filename -> DVC md5 hash
  trainingFiles:
    training_stratified.json: "77ff317f396636f76263054bf8bbbcab"
    training_leave_family_out.json: "fc3852ff6ce132ef878c0035046c5b75"
    training_leave_scenario_out.json: "9eac1e6caf34ef20e5114e83c8f2506b"
    training_leave_variation_out.json: "83c1515db2e994b2a0c485e30a43f4e9"
