{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ace-database.fullname" . }}-seed-{{ .Release.Revision }}
  labels:
    {{- include "ace-database.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "ace-database.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z {{ include "ace-database.fullname" . }} {{ .Values.service.port }}; do
            sleep 2
          done
          echo "PostgreSQL is ready"
      containers:
      - name: seed
        image: {{ .Values.seed.image.repository }}:{{ .Values.seed.image.tag }}
        command:
        - sh
        - -c
        - pip install --quiet boto3 psycopg2-binary && python /scripts/seed_scenarios.py
        env:
        - name: S3_ENDPOINT
          value: {{ .Values.seed.s3.endpoint | quote }}
        - name: S3_BUCKET
          value: {{ .Values.seed.s3.bucket | quote }}
        - name: DVC_PREFIX
          value: {{ .Values.seed.dvcPrefix | quote }}
        - name: TRAINING_FILES
          value: {{ .Values.seed.trainingFiles | toJson | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.seed.s3.existingSecret }}
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.seed.s3.existingSecret }}
              key: AWS_SECRET_ACCESS_KEY
        - name: PG_HOST
          value: {{ include "ace-database.fullname" . }}
        - name: PG_PORT
          value: {{ .Values.service.port | quote }}
        - name: PG_DB
          value: "ace"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret }}
              key: PG_USER
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret }}
              key: PG_PASSWORD
        volumeMounts:
        - name: seed-script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: seed-script
        configMap:
          name: {{ include "ace-database.fullname" . }}-seed
{{- end }}
