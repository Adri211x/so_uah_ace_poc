[project]
name = "so-ua-ace-poc"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "langfuse>=4.5.1",
    "pydantic-ai[mcp]>=1.87.0",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "sentence-transformers>=5.5.1",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.14",
    "pre-commit>=3.6",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/event_system"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "G",   # flake8-logging-format
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: end-to-end tests that hit external services (LLM, DB, MCP). Skipped by default; opt in with `-m integration`.",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
